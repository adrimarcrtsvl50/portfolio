<section class="skills section" id="habilidades">
  <div class="container">
    <div class="skills-header">
      <h2 class="section-title">Competencias técnicas</h2>
      <p class="skills-subtitle">
        Tecnologías y herramientas con las que trabajo
      </p>
    </div>
    
    <div class="skills-grid">
      <div class="skill-category" *ngFor="let category of categories">
        <h3 class="category-title">
          <span class="category-icon">{{ category.icon }}</span>
          {{ category.title }}
        </h3>
        <div class="skills-tags">
          <span class="skill-tag" *ngFor="let skill of category.skills">
            {{ skill }}
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
